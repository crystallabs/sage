# Runs the specs and the linter on every push and pull request. When a
# release is published, additionally builds ssg for each platform and
# attaches the archives to the release, after the specs have passed. Re-run
# the release part for an existing release with "Run workflow" and its tag.
#
# Release assets, as in https://github.com/crystallabs/fluence/releases:
#
#   ssg-<tag>-linux-x86_64.tar.gz    (+ .sha256)
#   ssg-<tag>-linux-aarch64.tar.gz   (+ .sha256)
#   ssg-<tag>-macos-x86_64.tar.gz    (+ .sha256)
#   ssg-<tag>-macos-aarch64.tar.gz   (+ .sha256)
#
# Linux binaries are fully static (musl, built in the Alpine Crystal image
# by .github/build-linux.sh) and are run inside a debian:12 container before
# they are uploaded, so a published binary is known to work on Debian 12 and
# later. The Alpine image is run with docker rather than as a job container
# because GitHub's JavaScript actions (checkout, upload-artifact) only work
# in Alpine containers on x64 runners, not on arm64.
#
# macOS binaries are built with Homebrew Crystal, but every Homebrew library
# is linked statically so the result depends only on system frameworks.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach binaries to
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}

      # install-crystal installs packages without refreshing the package
      # index, which fails when the runner image's index has gone stale.
      - name: Install native libraries
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libsass-dev

      - uses: crystal-lang/install-crystal@v1

      - name: Install dependencies
        run: shards install

      - name: Run specs
        run: crystal spec

      - name: Build
        run: crystal build --no-codegen src/main.cr

      - name: Lint
        run: |
          shards build ameba
          bin/ameba

  build-linux:
    name: build linux-${{ matrix.arch }}
    needs: test
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x86_64,  runner: ubuntu-latest}
          - {arch: aarch64, runner: ubuntu-24.04-arm}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build in the Alpine Crystal image
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            crystallang/crystal:latest-alpine sh .github/build-linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: ssg
          if-no-files-found: error

  test-linux:
    name: test linux-${{ matrix.arch }} on debian 12
    needs: build-linux
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x86_64,  runner: ubuntu-latest}
          - {arch: aarch64, runner: ubuntu-24.04-arm}
    # Bare image, nothing installed: the binary has to bring everything.
    container: debian:12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@v4
        with:
          name: linux-${{ matrix.arch }}

      - name: Run the binary
        run: |
          chmod +x ssg
          ./ssg version
          ./ssg build -s example
          test -f example/public/index.html

  upload-linux:
    name: upload linux-${{ matrix.arch }}
    needs: test-linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@v4
        with:
          name: linux-${{ matrix.arch }}

      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x ssg
          name="ssg-${TAG}-linux-${{ matrix.arch }}"
          tar czf "$name.tar.gz" ssg README.md
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          gh release upload "$TAG" "$name.tar.gz" "$name.tar.gz.sha256" --clobber

  macos:
    name: macos-${{ matrix.arch }}
    needs: test
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: aarch64, runner: macos-latest}
          - {arch: x86_64,  runner: macos-15-intel}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: crystal-lang/install-crystal@v1

      - name: Install native libraries
        run: brew install libsass libyaml openssl@3 bdw-gc libevent pcre2

      # The linker searches -L directories in order, so a directory holding
      # only the static archives makes it pick those over Homebrew's dylibs.
      - name: Collect static archives
        run: |
          mkdir static-libs
          for f in libsass libyaml openssl@3 bdw-gc libevent pcre2; do
            ln -s "$(brew --prefix "$f")"/lib/*.a static-libs/
          done
          ls -l static-libs

      - name: Build
        run: |
          shards install --without-development
          crystal build --release --no-debug src/main.cr -o ssg \
            --link-flags "-L$PWD/static-libs -lc++"
          otool -L ssg
          if otool -L ssg | grep -E '/opt/homebrew|/usr/local/(opt|Cellar)'; then
            echo "binary still depends on Homebrew libraries" >&2
            exit 1
          fi
          ./ssg version
          ./ssg build -s example
          test -f example/public/index.html

      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="ssg-${TAG}-macos-${{ matrix.arch }}"
          tar czf "$name.tar.gz" ssg README.md
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          gh release upload "$TAG" "$name.tar.gz" "$name.tar.gz.sha256" --clobber
